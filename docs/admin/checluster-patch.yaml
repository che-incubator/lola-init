# Merge patch for the CheCluster: adds the lola-init init container to every workspace pod.
#
#   oc patch checluster <name> -n <che-namespace> --type merge --patch-file checluster-patch.yaml
#
# A merge patch REPLACES the whole initContainers list. Use it only when the list is empty or absent;
# otherwise append the entry with a JSON patch (see README.md).
#
# Pin the image by digest (index of linux/amd64 and linux/arm64). Read it from the registry, never from the
# build log:
#
#   skopeo inspect --raw docker://quay.io/che-incubator/lola-init:latest | jq -r '.manifests[0].digest'
spec:
  devEnvironments:
    initContainers:
      - name: lola-init
        image: quay.io/che-incubator/lola-init@sha256:<digest>
        imagePullPolicy: IfNotPresent
        workingDir: /home/user
        volumeMounts:
          - name: persistent-home
            mountPath: /home/user/
